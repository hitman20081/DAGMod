plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = 'https://jitpack.io' }
}

loom {
	accessWidenerPath = file("src/main/resources/dagmod.accesswidener")
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered { it.mappings(rootProject.file("mappings/empty.tiny")) }
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// MC 26.1.2 uses Mojang official names natively (no ProGuard file), so empty.tiny gives
// official→named with no entries. Loom writes fabric.defaultModDistributionNamespace=official
// to launch.cfg, but Fabric API classTweakers declare namespace=named — causing a mismatch.
// Patch the generated launch.cfg after every regeneration so the namespace matches.
afterEvaluate {
	tasks.named('generateDLIConfig').configure {
		outputs.upToDateWhen { false }
		doLast {
			def cfg = layout.projectDirectory.file(".gradle/loom-cache/launch.cfg").asFile
			if (cfg.exists()) {
				def content = cfg.text
				// Fix distribution namespace (classTweakers declare "named")
				content = content.replace(
					'\tfabric.defaultModDistributionNamespace=official',
					'\tfabric.defaultModDistributionNamespace=named'
				)
				// Force runtime namespace to "named" so hasAnyMappings()=false doesn't
				// default to "official" (empty.tiny has no entries)
				if (!content.contains('fabric.runtimeMappingNamespace=')) {
					content = content.replace(
						'\tfabric.defaultModDistributionNamespace=named',
						'\tfabric.defaultModDistributionNamespace=named\n\tfabric.runtimeMappingNamespace=named'
					)
				}
				cfg.text = content
			}
		}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}